name: Browser review
on: pull_request
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04  # pinned: Playwright can't install browsers on ubuntu-26.04 yet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: node --test .github/scripts/deploy-pages.test.mjs
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-review-report
          path: playwright-report/
          retention-days: 7
